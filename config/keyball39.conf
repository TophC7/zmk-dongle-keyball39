CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_EVT_RX_COUNT=33
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Deep sleep after 30min idle. Wake by keypress (kscan).
# Trackball does NOT wake (PMW3610 lacks wakeup-source binding).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Default 0 dBm TX power. Re-enable +8 dBm if dongle range issues appear.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Reduce BLE chatter from battery service. Default 60s -> 5min.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Enable mouse/pointing device support globally
CONFIG_ZMK_MOUSE=y