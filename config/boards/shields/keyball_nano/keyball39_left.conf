CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# PMW3610 Driver - using badjeff's alt driver (renamed to avoid upstream conflicts)
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y

# nice_nano_v2 workaround - extra power-up delay
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# PMW3610 power management - downshift sensor through REST modes when idle.
# Defaults from badjeff fork; explicit so they're visible.
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=128
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=5000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=17000
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=100
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=500