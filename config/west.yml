manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
  projects:
    # Upstream zmkfirmware/zmk pinned to a known-good SHA. Avoids dgct fork
    # bit-rot (its app/west.yml pinned a Zephyr SHA that was force-pushed past
    # on dgct/zephyr's default branch, breaking shallow clones).
    - name: zmk
      remote: zmkfirmware
      revision: ead91ca094c6cd778574f73b9ae011ddab611c66
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main
  self:
    path: config
